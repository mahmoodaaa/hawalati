spring.application.name=hawalati-backend
server.port=7171
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000
app.otp.demo-enabled=true
app.otp.demo-code=123456
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.storage.documents-dir=${DOCUMENTS_DIR:/app/documents}
logging.level.com.hawalati.backend=INFO
