spring.application.name=hawalati-backend

# Server
server.port=7171

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hawalati_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000

# JPA - إعدادات التطوير
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT - المدد بالميلي ثانية
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000

# Demo OTP - بدون SMS
app.otp.demo-enabled=true
app.otp.demo-code=123456
app.otp.expiry-minutes=5
app.otp.max-attempts=5

# React frontend
app.cors.allowed-origins=http://localhost:5173

# Document uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.storage.documents-dir=${DOCUMENTS_DIR:./uploads/documents}

# Logging
logging.level.com.hawalati.backend=DEBUG
