# Test classpath only. Never inherit the application's PostgreSQL URL or ddl-auto=update.
spring.application.name=hawalati-security-tests
spring.datasource.url=jdbc:h2:mem:hawalati_security_tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Fictional, test-only key. Do not use for any deployed environment.
jwt.secret=fictional-hawalati-security-audit-signing-key-for-tests-only
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
app.otp.demo-enabled=false
app.otp.demo-code=123456
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.cors.allowed-origins=http://localhost:5173
app.storage.documents-dir=${java.io.tmpdir}/hawalati-security-test-documents
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
logging.level.com.hawalati.backend=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
