name: hawalati-demo
services:
  database:
    image: postgres:17-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: hawalati_db
      POSTGRES_USER: hawalati
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Start Hawalati using START_HAWALATI.bat to generate local secrets}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hawalati -d hawalati_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    image: hawalati-demo/backend:1.0.0
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://database:5432/hawalati_db
      DB_USERNAME: hawalati
      DB_PASSWORD: ${DB_PASSWORD:?Missing local DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Missing local JWT_SECRET}
      DOCUMENTS_DIR: /app/documents
      CORS_ALLOWED_ORIGINS: http://localhost:${HAWALATI_HTTP_PORT:-5173}
    volumes:
      - documents:/app/documents

  frontend:
    image: hawalati-demo/frontend:1.0.0
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HAWALATI_HTTP_PORT:-5173}:80"

volumes:
  database:
  documents:
